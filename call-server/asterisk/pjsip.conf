[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[line]
type=registration
outbound_auth=line-auth
server_uri=sip:${SIP_HOST}
client_uri=sip:${SIP_USER}@${SIP_HOST}

[line-auth]
type=auth
auth_type=userpass
username=${SIP_USER}
password=${SIP_PASSWORD}

[line]
type=aor
contact=sip:${SIP_HOST}

[line]
type=endpoint
context=from-line
disallow=all
allow=alaw,ulaw
outbound_auth=line-auth
aors=line
from_user=${CALLER_ID}
dtmf_mode=rfc4733
